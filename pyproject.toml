[project]
name = "deng-f1"
description = "Formula 1 Data Pipeline"
version = "0.1.0"
authors = [
    {name = "Florian Item", email = "florian.item@stud.hslu.ch"},
    {name = "Florian Leimer", email = "florian.leimer@stud.hslu.ch"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fsspec>=2026.9.0,<2027.0.0",
    "httpx>=0.28.1,<0.29.0",
    "psycopg[binary]>=3.2,<4",
    "pyrate-limiter>=4.5.0,<5.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "tenacity>=9.2.1,<10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9,<0.17.0",
]

[tool.uv]
# No package: the modules sit directly in src/ and are run as `uv run scripts/f1.py`
# (uv_build only builds package directories, not loose modules).
package = false

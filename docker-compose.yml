# Fixed project name, so the network is always `deng_default` (the Kestra flow runs its
# task containers on it), no matter which folder the repo is cloned into.
name: deng

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8085}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  code:
    image: deng-f1-code:local  # Kestra starts its task containers from this image
    build: .
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Kestra's own metadata (flows, executions, logs). Kept apart from the project database.
  kestra-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3.43
    restart: unless-stopped
    command: server standalone
    # root is needed to use the Docker socket.
    user: "root"
    ports:
      - "127.0.0.1:${KESTRA_PORT:-8080}:8080"
    volumes:
      - kestra_data:/app/storage
      # Kestra starts each task as a sibling container on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Task working directories must have the same path on the host and in Kestra.
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      # ENV_* variables are available in flows as {{ envs.* }}.
      # Absolute host path of data/: task containers mount it from the host's Docker.
      ENV_HOST_DATA_DIR: ${HOST_DATA_DIR:?Set HOST_DATA_DIR in .env}
      ENV_POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ENV_POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      ENV_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basicAuth:
              username: ${KESTRA_USER:?Set KESTRA_USER in .env}
              password: ${KESTRA_PASSWORD:?Set KESTRA_PASSWORD in .env}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${KESTRA_PORT:-8080}/
          tutorial-flows:
            enabled: false
          plugins:
            configurations:
              # Allows the flow to mount data/ into the task container.
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      kestra-postgres:
        condition: service_healthy

  # Imports every flow in orchestration/flows into Kestra once it is up, so nothing has to
  # be created in the UI. Import overwrites existing flows, so rerunning it is safe:
  # `docker compose restart kestra-flows` re-imports after editing a flow file.
  # (Kestra's own --flow-path loader runs before the plugins are loaded in 1.3.)
  kestra-flows:
    image: curlimages/curl:8.22.0
    volumes:
      - ./orchestration/flows:/flows:ro
    environment:
      KESTRA_USER: ${KESTRA_USER:?Set KESTRA_USER in .env}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:?Set KESTRA_PASSWORD in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for f in /flows/*.yaml; do
          echo "import $$f"
          curl -fsS -u "$$KESTRA_USER:$$KESTRA_PASSWORD" -F fileUpload=@$$f http://kestra:8080/api/v1/main/flows/import || exit 1
          echo
        done
        # Stay idle, so `docker compose up --wait` doesn't report the finished import as an error.
        exec tail -f /dev/null
    depends_on:
      kestra:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:

# Fixed project name, so the network is always `deng_default` (the Kestra flow runs its
# task containers on it), no matter which folder the repo is cloned into.
name: deng

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8085}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  code:
    image: deng-f1-code:local  # Kestra starts its task containers from this image
    build: .
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - raw_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # Kestra's own metadata (flows, executions, logs). Kept apart from the project database.
  kestra-postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3.43@sha256:cb713d0ed989b2dfbd09878eead3c26ca2ee447f89944eed676c2e31fb0cec0d
    restart: unless-stopped
    # Server settings live in orchestration/application.yaml (mounted below).
    command: server standalone --config /etc/kestra/application.yaml
    # root is needed to use the Docker socket.
    user: "root"
    ports:
      - "127.0.0.1:${KESTRA_PORT:-8080}:8080"
    volumes:
      - kestra_data:/app/storage
      # Kestra starts each task as a sibling container on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestration/application.yaml:/etc/kestra/application.yaml:ro
      # Kestra watches this folder and syncs every flow file into its database.
      - ./orchestration/flows:/flows:ro
    environment:
      # Secrets for application.yaml: Kestra fills in its ${...} from these.
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in .env}
      KESTRA_LOGIN_USER: ${KESTRA_USER:?Set KESTRA_USER in .env}
      KESTRA_LOGIN_PASSWORD: ${KESTRA_PASSWORD:?Set KESTRA_PASSWORD in .env}
      # ENV_* variables are available in flows as {{ envs.* }}.
      ENV_POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ENV_POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      ENV_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      kestra-postgres:
        condition: service_healthy

volumes:
  # Raw JSON files (data/raw). A named volume, not a host folder: Kestra's task containers
  # mount it by this fixed name, which works the same on macOS, Linux and Windows.
  # Created once by hand (`docker volume create deng_raw_data`), so `down -v` keeps it.
  raw_data:
    name: deng_raw_data
    external: true
  postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:

id: f1_race_weekend
namespace: deng.f1

description: |
  Weekly incremental load: every Monday, ingest the race of the past 7 days (if any).
  One execution loads at most one race weekend.
  History: Triggers tab → monday_after_race_weekend → Backfill executions from 2023-01-01.
  Manual run: set `date` to load the race of the 7 days before it (default: today).

inputs:
  - id: date
    type: DATE
    required: false
    description: Manual runs only. Ingest the race of the 7 days before this date (empty = today).

variables:
  day: >-
    {{ trigger.date is defined
       ? (trigger.date | date('yyyy-MM-dd'))
       : inputs.date ?? (now(timeZone="Europe/Zurich") | date('yyyy-MM-dd')) }}

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: monday_after_race_weekend
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    timezone: Europe/Zurich

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      containerImage: deng-f1-code:local
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        pullPolicy: NEVER  # built locally with `docker compose build code`
        volumes:
          - "deng_raw_data:/app/data"  # named volume from docker-compose.yml
      env:
        # Root of the lake (raw/, bronze/, silver/, gold/); gs://<bucket> once GCP is set up.
        LAKE_URI: /app/data

tasks:
  - id: check_source
    type: io.kestra.plugin.scripts.shell.Commands
    retry:
      type: exponential
      interval: PT15M
      delayFactor: 2
      maxInterval: PT1H
      maxAttempts: 5
    commands:
      - cd /app
      - python scripts/check_source.py

  - id: find_race
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - cd /app
      - python scripts/find_race.py --date {{ render(vars.day) }}

  - id: if_race
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.find_race.vars.meeting_key is defined }}"
    then:
      - id: fetch
        type: io.kestra.plugin.scripts.shell.Commands
        retry:
          type: exponential
          interval: PT5M
          maxInterval: PT1H
          maxAttempts: 4
        commands:
          - cd /app
          - >-
            python scripts/fetch.py
            --meeting-key {{ outputs.find_race.vars.meeting_key }}

      - id: bronze
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - >-
            python scripts/bronze.py
            --meeting-key {{ outputs.find_race.vars.meeting_key }}

      # silver and gold rebuild the race only if its input changed, and fail if it is not built.
      - id: silver
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - >-
            python scripts/silver.py
            --meeting-key {{ outputs.find_race.vars.meeting_key }}

      - id: gold
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - >-
            python scripts/gold.py
            --meeting-key {{ outputs.find_race.vars.meeting_key }}

id: f1_race_weekend
namespace: deng.f1

description: |
  Weekly incremental load: every Monday, ingest the race of the past 7 days (if any).
  One execution loads at most one race weekend.
  History: Triggers tab → monday_after_race_weekend → Backfill executions from 2023-01-01.
  Manual run: set `date` to load the race of the 7 days before it (default: today).

inputs:
  - id: date
    type: DATE
    defaults: "{{ now() | date('yyyy-MM-dd') }}"
    description: Manual runs only. Ingest the race of the 7 days before this date.

variables:
  day: >-
    {{ trigger.date is defined
       ? (trigger.date | date('yyyy-MM-dd'))
       : inputs.date }}

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: monday_after_race_weekend
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    timezone: Europe/Zurich

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      containerImage: deng-f1-code:local
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        pullPolicy: NEVER  # built locally with `docker compose build code`
        networkMode: deng_default
        volumes:
          - "deng_raw_data:/app/data"  # named volume from docker-compose.yml
      env:
        POSTGRES_HOST: postgres
        POSTGRES_DB: "{{ envs.postgres_db }}"
        POSTGRES_USER: "{{ envs.postgres_user }}"
        POSTGRES_PASSWORD: "{{ envs.postgres_password }}"

tasks:
  - id: check_source
    type: io.kestra.plugin.scripts.shell.Commands
    retry:
      type: exponential
      interval: PT15M
      delayFactor: 2
      maxInterval: PT1H
      maxAttempts: 5
    commands:
      - cd /app
      - python scripts/check_source.py --date {{ render(vars.day) }}

  - id: if_race
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_source.vars.meeting_key is defined }}"
    then:
      - id: fetch
        type: io.kestra.plugin.scripts.shell.Commands
        retry:
          type: exponential
          interval: PT5M
          maxInterval: PT1H
          maxAttempts: 4
        commands:
          - cd /app
          - >-
            python scripts/fetch.py
            --meeting-key {{ outputs.check_source.vars.meeting_key }}

      - id: load
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - python scripts/load.py

      - id: transform
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - python scripts/transform.py

      - id: validate
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - cd /app
          - python scripts/validate.py
